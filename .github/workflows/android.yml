      - name: Set single Gradle app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path("app/build.gradle.kts")
          source = path.read_text(encoding="utf-8")
          version = os.environ["APP_VERSION_NAME"]
          updated, count = re.subn(
              r'(?m)^(\s*versionName\s*=\s*)"[^"]+"',
              lambda match: match.group(1) + '"' + version + '"',
              source,
              count=1
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one Gradle versionName declaration; found {count}.")
          path.write_text(updated, encoding="utf-8")
          print(f"Gradle version source set once: {version}; versionCode comes from VERSION_CODE.")
          PY

      - name: Inspect Compose navigation and lyrics source
