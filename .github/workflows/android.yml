name: Android release build

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chiyuriplayer-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public release repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f ChiyuriPlayer-0.2.0-source-prep.zip || {
            echo "::error::Upload ChiyuriPlayer-0.2.0-source-prep.zip to the repository root first."
            exit 1
          }

      - name: Extract application source
        run: |
          mkdir -p /tmp/chiyuri-source
          unzip -q ChiyuriPlayer-0.2.0-source-prep.zip -d /tmp/chiyuri-source
          test -f /tmp/chiyuri-source/ChiyuriPlayer-main/app/build.gradle.kts
          rsync -a --exclude='.github/' --exclude='README.md' --exclude='README_RU.md' /tmp/chiyuri-source/ChiyuriPlayer-main/ "$GITHUB_WORKSPACE"/

      - name: Repair Kotlin compile issues in update screens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/chiyuri/player/AppUpdates.kt")
          lines = p.read_text(encoding="utf-8").splitlines()
          if "import androidx.compose.runtime.getValue" not in lines:
              i = lines.index("import androidx.compose.runtime.Composable")
              lines[i + 1:i + 1] = [
                  "import androidx.compose.runtime.getValue",
                  "import androidx.compose.runtime.setValue",
              "import androidx.compose.material.icons.filled.SystemUpdate",
              "import androidx.compose.material.icons.filled.Download",
              "import androidx.compose.material.icons.filled.Refresh",
              ]
          s = "\n".join(lines) + "\n"
          s = s.replace("installed.signingInfo.apkContentsSigners", "installed.signingInfo?.apkContentsSigners")
          s = s.replace("androidx.compose.material3.Row(", "androidx.compose.foundation.layout.Row(")
          p.write_text(s, encoding="utf-8")
          main = Path("app/src/main/java/com/chiyuri/player/MainActivity.kt")
          m = main.read_text(encoding="utf-8")
          old = "modifier = modifier.fillMaxWidth().verticalScroll(rememberScrollState()),"
          if old not in m:
              raise SystemExit("AudioEffectsScreen scroll modifier was not found; refusing unsafe patch.")
          m = m.replace(old, "modifier = modifier.fillMaxWidth(),", 1)
          main.write_text(m, encoding="utf-8")
          print("Fixed nested vertical scrolling in More > Audio Effects.")
          # ChiyuriPlayer visual refresh: black/red palette, branded header, and legacy launcher icon fallback.
          main = Path("app/src/main/java/com/chiyuri/player/MainActivity.kt")
          m = main.read_text(encoding="utf-8")
          m = m.replace("private val Night = Color(0xFF101116)", "private val Night = Color(0xFF080000)")
          m = m.replace("private val Panel = Color(0xFF1C1E27)", "private val Panel = Color(0xFF17090C)")
          m = m.replace("private val Accent = Color(0xFFB7A0FF)", "private val Accent = Color(0xFFFF1744)")
          m = m.replace("primary = Accent,\n            secondary = Color(0xFF82D8C8)", "primary = Accent,\n            secondary = Color(0xFFFF526F)")
          m = m.replace('Text("CHIYURI", color = MaterialTheme.colorScheme.primary, fontSize = 13.sp, letterSpacing = 4.sp)', 'Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.padding(bottom = 8.dp)) {\n                androidx.compose.foundation.Image(painter = androidx.compose.ui.res.painterResource(com.chiyuri.player.R.mipmap.ic_launcher), contentDescription = "ChiyuriPlayer", modifier = Modifier.size(42.dp), contentScale = androidx.compose.ui.layout.ContentScale.Crop)\n                Spacer(Modifier.width(10.dp))\n                Column {\n                    Text("Chiyuri", color = MaterialTheme.colorScheme.onSurface, fontSize = 19.sp, fontWeight = androidx.compose.ui.text.font.FontWeight.SemiBold)\n                    Text("PLAYER", color = MaterialTheme.colorScheme.primary, fontSize = 10.sp, letterSpacing = 3.sp)\n                }\n            }')
          main.write_text(m, encoding="utf-8")
          palette = Path("app/src/main/java/com/chiyuri/player/TrackArtworkBackdrop.kt")
          t = palette.read_text(encoding="utf-8")
          t = t.replace("primary = Color(0xFFB7A0FF)", "primary = Color(0xFFFF1744)")
          t = t.replace("secondary = Color(0xFF82D8C8)", "secondary = Color(0xFFFF526F)")
          t = t.replace("background = Color(0xFF101116)", "background = Color(0xFF080000)")
          t = t.replace("surface = Color(0xFF1C1E27)", "surface = Color(0xFF17090C)")
          palette.write_text(t, encoding="utf-8")
          # Adaptive icon foreground currently reuses a full-bleed square logo and gets cropped by Android masks.
          # Remove adaptive wrappers so Android uses the verified density-specific CP launcher PNGs.
          for icon in [Path("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"), Path("app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml")]:
              if icon.exists(): icon.unlink()
          print("Applied red/black visual theme, branded header, red artwork-palette defaults, and safe legacy launcher icon resources.")
          # Blood-red visual direction and fixed Gothic wordmark treatment.
          import urllib.request
          font_dir = Path("app/src/main/res/font")
          font_dir.mkdir(parents=True, exist_ok=True)
          urllib.request.urlretrieve("https://raw.githubusercontent.com/cyrealtype/UnifracturCook/master/UnifrakturCook-Regular-hints.ttf", font_dir / "unifraktur_cook.ttf")
          license_path = Path("app/src/main/assets/licenses/UnifrakturCook-OFL.txt")
          license_path.parent.mkdir(parents=True, exist_ok=True)
          urllib.request.urlretrieve("https://raw.githubusercontent.com/cyrealtype/UnifracturCook/master/OFL.txt", license_path)
          main = Path("app/src/main/java/com/chiyuri/player/MainActivity.kt")
          m = main.read_text(encoding="utf-8")
          m = m.replace('Text("PLAYER", color = MaterialTheme.colorScheme.primary, fontSize = 10.sp, letterSpacing = 3.sp)', '')
          m = m.replace('Text("Chiyuri", color = MaterialTheme.colorScheme.onSurface, fontSize = 19.sp, fontWeight = androidx.compose.ui.text.font.FontWeight.SemiBold)', 'Text("Chiyuri", color = Color(0xFF8B0000), fontSize = 25.sp, fontFamily = androidx.compose.ui.text.font.FontFamily(androidx.compose.ui.text.font.Font(com.chiyuri.player.R.font.unifraktur_cook)), fontWeight = androidx.compose.ui.text.font.FontWeight.Bold, style = androidx.compose.ui.text.TextStyle(shadow = androidx.compose.ui.graphics.Shadow(Color(0xFFFF2038), offset = androidx.compose.ui.geometry.Offset(0f, 2f), blurRadius = 9f)))')
          main.write_text(m, encoding="utf-8")
          palette = Path("app/src/main/java/com/chiyuri/player/TrackArtworkBackdrop.kt")
          t = palette.read_text(encoding="utf-8")
          t = t.replace('modifier = Modifier.fillMaxSize().blur(38.dp).alpha(0.42f)', 'modifier = Modifier.fillMaxSize().blur(6.dp).alpha(0.38f)')
          marker = '        val colors = androidx.compose.material3.MaterialTheme.colorScheme\n'
          blood = '''        val colors = androidx.compose.material3.MaterialTheme.colorScheme
          androidx.compose.foundation.Canvas(Modifier.fillMaxSize().alpha(0.30f)) {
              val w = size.width
              val h = size.height
              val blood = androidx.compose.ui.graphics.Path().apply {
                  moveTo(0f, 0f)
                  lineTo(w, 0f)
                  lineTo(w, h * 0.13f)
                  cubicTo(w * 0.91f, h * 0.17f, w * 0.94f, h * 0.23f, w * 0.86f, h * 0.25f)
                  cubicTo(w * 0.78f, h * 0.27f, w * 0.83f, h * 0.34f, w * 0.75f, h * 0.36f)
                  lineTo(w * 0.72f, h * 0.18f)
                  cubicTo(w * 0.64f, h * 0.23f, w * 0.68f, h * 0.29f, w * 0.60f, h * 0.30f)
                  lineTo(w * 0.57f, h * 0.12f)
                  cubicTo(w * 0.48f, h * 0.17f, w * 0.52f, h * 0.24f, w * 0.44f, h * 0.25f)
                  lineTo(w * 0.40f, h * 0.10f)
                  cubicTo(w * 0.31f, h * 0.15f, w * 0.35f, h * 0.22f, w * 0.27f, h * 0.24f)
                  lineTo(w * 0.24f, h * 0.12f)
                  cubicTo(w * 0.15f, h * 0.18f, w * 0.18f, h * 0.23f, w * 0.09f, h * 0.25f)
                  lineTo(0f, h * 0.16f)
                  close()
              }
              drawPath(blood, Brush.verticalGradient(listOf(colors.primary.copy(alpha = 0.72f), colors.secondary.copy(alpha = 0.16f), Color.Transparent), endY = h * 0.38f))
          }
'''
          if marker not in t:
              raise SystemExit("Backdrop theme insertion point missing.")
          t = t.replace(marker, blood, 1)
          palette.write_text(t, encoding="utf-8")
          print("Added adaptive theme-colored blood overlay, 6dp artwork blur, and fixed crimson Gothic wordmark with OFL font.")
          PY
          grep -nE 'runtime.getValue|runtime.setValue|signingInfo\\?\\.apkContentsSigners|foundation.layout.Row' app/src/main/java/com/chiyuri/player/AppUpdates.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore release signing key
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$ANDROID_SIGNING_KEY_BASE64" || {
            echo "::error::Add repository Actions secret ANDROID_SIGNING_KEY_BASE64 before building releases."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/chiyuri-signing"
          echo "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/chiyuri-signing/release.jks"
          test -s "$RUNNER_TEMP/chiyuri-signing/release.jks"

      - name: Run unit tests
        run: gradle testDebugUnitTest -PVERSION_CODE=204

      - name: Build signed release APK
        env:
          CHIYURI_KEYSTORE_PATH: ${{ runner.temp }}/chiyuri-signing/release.jks
          CHIYURI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHIYURI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHIYURI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$CHIYURI_KEYSTORE_PASSWORD"
          test -n "$CHIYURI_KEY_ALIAS"
          test -n "$CHIYURI_KEY_PASSWORD"
          gradle --no-build-cache clean assembleRelease -PVERSION_CODE=204

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee ChiyuriPlayer-0.2.4.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChiyuriPlayer-0.2.4
          path: |
            app/build/outputs/apk/release/app-release.apk
            ChiyuriPlayer-0.2.4.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.4
          name: ChiyuriPlayer 0.2.4
          body: |
            Насыщенная кроваво-красная тема, адаптивный кровавый фон, читаемые обложки, готический логотип Chiyuri без перекраски.
            Unit-тесты и проверка подписи должны завершиться успешно.
            APK подписан тем же постоянным ключом, что и предыдущая версия.
          files: |
            app/build/outputs/apk/release/app-release.apk
            ChiyuriPlayer-0.2.4.sha256
          make_latest: true
          fail_on_unmatched_files: true
