          from pathlib import Path
          targets = {
              "MainActivity.kt": ["private fun MiniPlayerBar(", "NavigationBar(", "NavigationBarItem(", "private fun Lyrics", "LyricsScreen("],
              "LyricsScreen.kt": ["@Composable", "LazyColumn", "verticalScroll", "Search"],
