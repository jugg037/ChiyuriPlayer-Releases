name: Android release build

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chiyuriplayer-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public release repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f ChiyuriPlayer-0.2.0-source-prep.zip || {
            echo "::error::Upload ChiyuriPlayer-0.2.0-source-prep.zip to the repository root first."
            exit 1
          }

      - name: Extract application source
        run: |
          mkdir -p /tmp/chiyuri-source
          unzip -q ChiyuriPlayer-0.2.0-source-prep.zip -d /tmp/chiyuri-source
          test -f /tmp/chiyuri-source/ChiyuriPlayer-main/app/build.gradle.kts
          rsync -a --exclude='.github/' --exclude='README.md' --exclude='README_RU.md' /tmp/chiyuri-source/ChiyuriPlayer-main/ "$GITHUB_WORKSPACE"/

      - name: Repair Kotlin compile issues in update screens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/chiyuri/player/AppUpdates.kt")
          lines = p.read_text(encoding="utf-8").splitlines()
          if "import androidx.compose.runtime.getValue" not in lines:
              i = lines.index("import androidx.compose.runtime.Composable")
              lines[i + 1:i + 1] = [
                  "import androidx.compose.runtime.getValue",
                  "import androidx.compose.runtime.setValue",
              "import androidx.compose.material.icons.filled.SystemUpdate",
              "import androidx.compose.material.icons.filled.Download",
              "import androidx.compose.material.icons.filled.Refresh",
              ]
          s = "\n".join(lines) + "\n"
          s = s.replace("installed.signingInfo.apkContentsSigners", "installed.signingInfo?.apkContentsSigners")
          s = s.replace("androidx.compose.material3.Row(", "androidx.compose.foundation.layout.Row(")
          p.write_text(s, encoding="utf-8")
          main = Path("app/src/main/java/com/chiyuri/player/MainActivity.kt")
          m = main.read_text(encoding="utf-8")
          old = "modifier = modifier.fillMaxWidth().verticalScroll(rememberScrollState()),"
          if old not in m:
              raise SystemExit("AudioEffectsScreen scroll modifier was not found; refusing unsafe patch.")
          m = m.replace(old, "modifier = modifier.fillMaxWidth(),", 1)
          main.write_text(m, encoding="utf-8")
          print("Fixed nested vertical scrolling in More > Audio Effects.")
          # ChiyuriPlayer visual refresh: black/red palette, branded header, and legacy launcher icon fallback.
          main = Path("app/src/main/java/com/chiyuri/player/MainActivity.kt")
          m = main.read_text(encoding="utf-8")
          m = m.replace("private val Night = Color(0xFF101116)", "private val Night = Color(0xFF080000)")
          m = m.replace("private val Panel = Color(0xFF1C1E27)", "private val Panel = Color(0xFF17090C)")
          m = m.replace("private val Accent = Color(0xFFB7A0FF)", "private val Accent = Color(0xFFFF1744)")
          m = m.replace("primary = Accent,\n            secondary = Color(0xFF82D8C8)", "primary = Accent,\n            secondary = Color(0xFFFF526F)")
          m = m.replace('Text("CHIYURI", color = MaterialTheme.colorScheme.primary, fontSize = 13.sp, letterSpacing = 4.sp)', 'Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.padding(bottom = 8.dp)) {\n                androidx.compose.foundation.Image(painter = androidx.compose.ui.res.painterResource(com.chiyuri.player.R.mipmap.ic_launcher), contentDescription = "ChiyuriPlayer", modifier = Modifier.size(42.dp), contentScale = androidx.compose.ui.layout.ContentScale.Crop)\n                Spacer(Modifier.width(10.dp))\n                Column {\n                    Text("Chiyuri", color = MaterialTheme.colorScheme.onSurface, fontSize = 19.sp, fontWeight = androidx.compose.ui.text.font.FontWeight.SemiBold)\n                    Text("PLAYER", color = MaterialTheme.colorScheme.primary, fontSize = 10.sp, letterSpacing = 3.sp)\n                }\n            }')
          main.write_text(m, encoding="utf-8")
          palette = Path("app/src/main/java/com/chiyuri/player/TrackArtworkBackdrop.kt")
          t = palette.read_text(encoding="utf-8")
          t = t.replace("primary = Color(0xFFB7A0FF)", "primary = Color(0xFFFF1744)")
          t = t.replace("secondary = Color(0xFF82D8C8)", "secondary = Color(0xFFFF526F)")
          t = t.replace("background = Color(0xFF101116)", "background = Color(0xFF080000)")
          t = t.replace("surface = Color(0xFF1C1E27)", "surface = Color(0xFF17090C)")
          palette.write_text(t, encoding="utf-8")
          # Adaptive icon foreground currently reuses a full-bleed square logo and gets cropped by Android masks.
          # Remove adaptive wrappers so Android uses the verified density-specific CP launcher PNGs.
          for icon in [Path("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"), Path("app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml")]:
              if icon.exists(): icon.unlink()
          print("Applied red/black visual theme, branded header, red artwork-palette defaults, and safe legacy launcher icon resources.")
          # Blood-red visual direction and fixed Gothic wordmark treatment.
          import urllib.request
          font_dir = Path("app/src/main/res/font")
          font_dir.mkdir(parents=True, exist_ok=True)
          urllib.request.urlretrieve("https://raw.githubusercontent.com/cyrealtype/UnifracturCook/master/UnifrakturCook-Regular-hints.ttf", font_dir / "unifraktur_cook.ttf")
          license_path = Path("app/src/main/assets/licenses/UnifrakturCook-OFL.txt")
          license_path.parent.mkdir(parents=True, exist_ok=True)
          urllib.request.urlretrieve("https://raw.githubusercontent.com/cyrealtype/UnifracturCook/master/OFL.txt", license_path)
          main = Path("app/src/main/java/com/chiyuri/player/MainActivity.kt")
          m = main.read_text(encoding="utf-8")
          m = m.replace('Text("PLAYER", color = MaterialTheme.colorScheme.primary, fontSize = 10.sp, letterSpacing = 3.sp)', '')
          m = m.replace('Text("Chiyuri", color = MaterialTheme.colorScheme.onSurface, fontSize = 19.sp, fontWeight = androidx.compose.ui.text.font.FontWeight.SemiBold)', 'Text("Chiyuri", color = Color(0xFF8B0000), fontSize = 25.sp, fontFamily = androidx.compose.ui.text.font.FontFamily(androidx.compose.ui.text.font.Font(com.chiyuri.player.R.font.unifraktur_cook)), fontWeight = androidx.compose.ui.text.font.FontWeight.Bold, style = androidx.compose.ui.text.TextStyle(shadow = androidx.compose.ui.graphics.Shadow(Color(0xFFFF2038), offset = androidx.compose.ui.geometry.Offset(0f, 2f), blurRadius = 9f)))')
          main.write_text(m, encoding="utf-8")
          palette = Path("app/src/main/java/com/chiyuri/player/TrackArtworkBackdrop.kt")
          t = palette.read_text(encoding="utf-8")
          t = t.replace('modifier = Modifier.fillMaxSize().blur(38.dp).alpha(0.42f)', 'modifier = Modifier.fillMaxSize().blur(6.dp).alpha(0.38f)')
          marker = "        val colors = androidx.compose.material3.MaterialTheme.colorScheme" + chr(10)
          blood_lines = [
              "        val colors = androidx.compose.material3.MaterialTheme.colorScheme",
              "        androidx.compose.foundation.Canvas(Modifier.fillMaxSize().alpha(0.30f)) {",
              "            val w = size.width",
              "            val h = size.height",
              "            val blood = androidx.compose.ui.graphics.Path().apply {",
              "                moveTo(0f, 0f)",
              "                lineTo(w, 0f)",
              "                lineTo(w, h * 0.13f)",
              "                cubicTo(w * 0.91f, h * 0.17f, w * 0.94f, h * 0.23f, w * 0.86f, h * 0.25f)",
              "                cubicTo(w * 0.78f, h * 0.27f, w * 0.83f, h * 0.34f, w * 0.75f, h * 0.36f)",
              "                lineTo(w * 0.72f, h * 0.18f)",
              "                cubicTo(w * 0.64f, h * 0.23f, w * 0.68f, h * 0.29f, w * 0.60f, h * 0.30f)",
              "                lineTo(w * 0.57f, h * 0.12f)",
              "                cubicTo(w * 0.48f, h * 0.17f, w * 0.52f, h * 0.24f, w * 0.44f, h * 0.25f)",
              "                lineTo(w * 0.40f, h * 0.10f)",
              "                cubicTo(w * 0.31f, h * 0.15f, w * 0.35f, h * 0.22f, w * 0.27f, h * 0.24f)",
              "                lineTo(w * 0.24f, h * 0.12f)",
              "                cubicTo(w * 0.15f, h * 0.18f, w * 0.18f, h * 0.23f, w * 0.09f, h * 0.25f)",
              "                lineTo(0f, h * 0.16f)",
              "                close()",
              "            }",
              "            drawPath(blood, Brush.verticalGradient(listOf(colors.primary.copy(alpha = 0.72f), colors.secondary.copy(alpha = 0.16f), Color.Transparent), endY = h * 0.38f))",
              "        }",
          ]
          blood = chr(10).join(blood_lines) + chr(10)
          if marker not in t:
              raise SystemExit("Backdrop theme insertion point missing.")
          t = t.replace(marker, blood, 1)
          palette.write_text(t, encoding="utf-8")
          print("Added adaptive theme-colored blood overlay, 6dp artwork blur, and fixed crimson Gothic wordmark with OFL font.")
          PY
          grep -nE 'runtime.getValue|runtime.setValue|signingInfo\\?\\.apkContentsSigners|foundation.layout.Row' app/src/main/java/com/chiyuri/player/AppUpdates.kt

      - name: Expand automatic lyrics search and sharpen Gothic wordmark
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path("app/src/main/java/com/chiyuri/player/MainActivity.kt")
          m = main.read_text(encoding="utf-8")
          m = m.replace(", style = androidx.compose.ui.text.TextStyle(shadow = androidx.compose.ui.graphics.Shadow(Color(0xFFFF2038), offset = androidx.compose.ui.geometry.Offset(0f, 2f), blurRadius = 9f))", "")
          main.write_text(m, encoding="utf-8")

          lyrics = Path("app/src/main/java/com/chiyuri/player/LyricsRepository.kt")
          s = lyrics.read_text(encoding="utf-8")
          start = s.index("    suspend fun search(")
          end = s.index("    private fun addSearchResults", start)
          replacement = r'''    suspend fun search(artist: String, title: String, durationMs: Long): LyricsResult? =
                  withContext(Dispatchers.IO) {
                      val cleanTitle = title.trim()
                      if (cleanTitle.isBlank()) return@withContext null
                      val cleanArtist = artist.trim()
                      val durationSeconds = (durationMs / 1000L).takeIf { it > 0L }
                      val titleVariants = lyricsTitleVariants(cleanTitle)
                      val artistVariants = lyricsArtistVariants(cleanArtist)
                      val candidates = linkedMapOf<String, LyricsCandidate>()
          
                      // Primary provider: LRCLIB, including exact and broad metadata search.
                      for (titleVariant in titleVariants.take(3)) {
                          for (artistVariant in (artistVariants.take(2) + "").distinct()) {
                              val path = buildString {
                                  append("/api/get?track_name=").append(encode(titleVariant))
                                  if (artistVariant.isNotBlank()) append("&artist_name=").append(encode(artistVariant))
                                  if (durationSeconds != null) append("&duration=").append(durationSeconds)
                              }
                              val raw = request(path) ?: continue
                              val candidate = runCatching { parseCandidate(JSONObject(raw)) }.getOrNull() ?: continue
                              candidates.putIfAbsent(candidateKey(candidate), candidate)
                              if (isStrongMatch(candidate, cleanTitle, cleanArtist, durationSeconds)) return@withContext candidate.result
                          }
                      }
                      for (titleVariant in titleVariants) {
                          for (artistVariant in (artistVariants.take(2) + "").distinct()) {
                              val path = buildString {
                                  append("/api/search?track_name=").append(encode(titleVariant))
                                  if (artistVariant.isNotBlank()) append("&artist_name=").append(encode(artistVariant))
                              }
                              addSearchResults(request(path), candidates)
                          }
                      }
                      val freeText = listOf(cleanArtist, cleanTitle).filter { it.isNotBlank() }.joinToString(" ")
                      if (freeText.isNotBlank()) addSearchResults(request("/api/search?q=" + encode(freeText)), candidates)
                      val bestLrcLib = candidates.values
                          .map { it to lyricsCandidateScore(it, cleanTitle, cleanArtist, durationSeconds) }
                          .maxByOrNull { it.second }
                      if (bestLrcLib != null && bestLrcLib.second >= 0.50) return@withContext bestLrcLib.first.result
          
                      // Secondary provider: lyrics.ovh direct title/artist lookup (plain lyrics).
                      for (titleVariant in titleVariants.take(2)) {
                          for (artistVariant in artistVariants.take(2)) {
                              val raw = requestAbsolute("https://api.lyrics.ovh/v1/${encodePath(artistVariant)}/${encodePath(titleVariant)}") ?: continue
                              val text = runCatching { JSONObject(raw).optString("lyrics") }.getOrNull()
                                  ?.takeIf { it.isNotBlank() && it != "null" } ?: continue
                              return@withContext LyricsResult(text, null)
                          }
                      }
          
                      // Final fallback: Deezer-backed suggestions from lyrics.ovh; rank before fetching.
                      val suggestions = linkedMapOf<String, JSONObject>()
                      val queries = listOf("$cleanArtist $cleanTitle", cleanTitle).filter { it.isNotBlank() }.distinct()
                      for (query in queries) {
                          val raw = requestAbsolute("https://api.lyrics.ovh/suggest/${encodePath(query)}") ?: continue
                          val data = runCatching { JSONObject(raw).optJSONArray("data") }.getOrNull() ?: continue
                          for (index in 0 until minOf(data.length(), 12)) {
                              val item = data.optJSONObject(index) ?: continue
                              val trackTitle = item.optString("title")
                              val trackArtist = item.optJSONObject("artist")?.optString("name").orEmpty()
                              if (trackTitle.isBlank() || trackArtist.isBlank()) continue
                              suggestions.putIfAbsent("${normalizeLyricsText(trackTitle)}|${normalizeLyricsText(trackArtist)}", item)
                          }
                      }
                      val ranked = suggestions.values.mapNotNull { item ->
                          val trackTitle = item.optString("title")
                          val trackArtist = item.optJSONObject("artist")?.optString("name").orEmpty()
                          val trackDuration = item.optLong("duration").takeIf { it > 0L } ?: 0L
                          val candidate = LyricsCandidate(LyricsResult(null, null), trackTitle, trackArtist, trackDuration)
                          candidate to lyricsCandidateScore(candidate, cleanTitle, cleanArtist, durationSeconds)
                      }.sortedByDescending { it.second }
                      for ((candidate, score) in ranked.take(4)) {
                          if (score < 0.58) continue
                          val raw = requestAbsolute("https://api.lyrics.ovh/v1/${encodePath(candidate.artist)}/${encodePath(candidate.title)}") ?: continue
                          val text = runCatching { JSONObject(raw).optString("lyrics") }.getOrNull()
                              ?.takeIf { it.isNotBlank() && it != "null" } ?: continue
                          return@withContext LyricsResult(text, null)
                      }
                      null
                  }
          
          '''
          s = s[:start] + replacement + s[end:]
          request_start = s.index("    private fun request(path: String): String? {")
          request_end = s.index("    private fun parseCandidate", request_start)
          request_block = '''    private fun request(path: String): String? = requestAbsolute("https://lrclib.net$path")
          
              private fun requestAbsolute(address: String): String? {
                  val connection = (URL(address).openConnection() as HttpURLConnection)
                  return try {
                      connection.requestMethod = "GET"
                      connection.connectTimeout = 5_000
                      connection.readTimeout = 5_000
                      connection.setRequestProperty("Accept", "application/json")
                      connection.setRequestProperty("User-Agent", "ChiyuriPlayer/0.2.5 (https://github.com/jugg037/ChiyuriPlayer-Releases)")
                      if (connection.responseCode !in 200..299) return null
                      connection.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                  } catch (_: Exception) {
                      null
                  } finally {
                      connection.disconnect()
                  }
              }
          
              private fun encodePath(value: String): String =
                  URLEncoder.encode(value, Charsets.UTF_8.name()).replace("+", "%20")
          
          '''
          s = s[:request_start] + request_block + s[request_end:]
          lyrics.write_text(s, encoding="utf-8")

          screen = Path("app/src/main/java/com/chiyuri/player/LyricsScreen.kt")
          ui = screen.read_text(encoding="utf-8")
          ui = ui.replace("Во встроенных тегах и LRCLIB текст не найден.", "Во встроенных тегах, LRCLIB и lyrics.ovh текст не найден.")
          ui = ui.replace("Поиск использует точное совпадение, альтернативные варианты названия и исполнителя, а затем расширенный запрос.", "Поиск проверяет встроенные теги, LRCLIB, lyrics.ovh и варианты названия/исполнителя через каталог Deezer.")
          screen.write_text(ui, encoding="utf-8")

          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8").replace('versionName = "0.2.1"', 'versionName = "0.2.7"')
          gradle.write_text(g, encoding="utf-8")
          print("Removed logo shadow blur; expanded lyrics lookup to LRCLIB, lyrics.ovh and Deezer suggestions.")
          PY

      - name: Apply Gothic controls, mini-player transparency and live installed version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("app/src/main")
          main = root / "java/com/chiyuri/player/MainActivity.kt"
          m = main.read_text(encoding="utf-8")
          old_surface = "color = MaterialTheme.colorScheme.surface,"
          if old_surface not in m:
              raise SystemExit("Mini-player Surface color not found.")
          mini_start = m.index("private fun MiniPlayerBar(")
          mini_end = m.index("\n@Composable", mini_start + 20)
          mini = m[mini_start:mini_end]
          if old_surface not in mini:
              raise SystemExit("Mini-player surface color marker not found in MiniPlayerBar.")
          mini = mini.replace(old_surface, "color = MaterialTheme.colorScheme.surface.copy(alpha = if (expanded) 0.5f else 1f),", 1)
          m = m[:mini_start] + mini + m[mini_end:]

          theme_old = "MaterialTheme(colorScheme = colors, content = content)"
          theme_new = """MaterialTheme(
              colorScheme = colors.copy(primary = Color(0xFFB20D24), secondary = Color(0xFF7A1024)),
              shapes = androidx.compose.material3.Shapes(
                  extraSmall = androidx.compose.foundation.shape.CutCornerShape(4.dp),
                  small = androidx.compose.foundation.shape.CutCornerShape(7.dp),
                  medium = androidx.compose.foundation.shape.CutCornerShape(11.dp),
                  large = androidx.compose.foundation.shape.CutCornerShape(16.dp),
                  extraLarge = androidx.compose.foundation.shape.CutCornerShape(20.dp)
              ),
              content = content
          )"""
          if theme_old not in m:
              raise SystemExit("ChiyuriTheme MaterialTheme marker not found.")
          m = m.replace(theme_old, theme_new, 1)
          main.write_text(m, encoding="utf-8")

          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          g = g.replace('versionName = "0.2.7"', 'versionName = "0.2.7"')
          g = g.replace('versionName = "0.2.1"', 'versionName = "0.2.7"')
          g = g.replace("buildFeatures { compose = true }", "buildFeatures { compose = true; buildConfig = true }")
          if "buildConfig = true" not in g:
              raise SystemExit("Could not enable BuildConfig generation.")
          gradle.write_text(g, encoding="utf-8")

          updates = root / "java/com/chiyuri/player/AppUpdates.kt"
          u = updates.read_text(encoding="utf-8")
          u = u.replace('const val CURRENT_VERSION = "0.2.1"', 'const val CURRENT_VERSION = BuildConfig.VERSION_NAME')
          u = u.replace("const val CURRENT_VERSION_CODE = 201", "const val CURRENT_VERSION_CODE = BuildConfig.VERSION_CODE")
          if "BuildConfig.VERSION_NAME" not in u or "BuildConfig.VERSION_CODE" not in u:
              raise SystemExit("Installed version constants could not be updated.")
          updates.write_text(u, encoding="utf-8")

          print("Expanded mini-player transparency to 50%, tied installed version to BuildConfig, and applied Gothic icon frames/cut-corner controls.")
          PY

      - name: Build true Gothic UI geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path("app/src/main/java/com/chiyuri/player")
          ui = base / "GothicUi.kt"
          source = """package com.chiyuri.player

          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.RowScope
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.size
          import androidx.compose.foundation.shape.GenericShape
          import androidx.compose.material3.Icon
          import androidx.compose.material3.IconButton
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.unit.dp

          val ChiyuriGothicShape = GenericShape { size, _ ->
              val w = size.width
              val h = size.height
              moveTo(w * 0.10f, h)
              lineTo(0f, h * 0.86f)
              lineTo(0f, h * 0.22f)
              lineTo(w * 0.16f, h * 0.22f)
              lineTo(w * 0.50f, 0f)
              lineTo(w * 0.84f, h * 0.22f)
              lineTo(w, h * 0.22f)
              lineTo(w, h * 0.86f)
              lineTo(w * 0.90f, h)
              close()
          }

          @Composable
          fun GothicIcon(
              imageVector: ImageVector,
              contentDescription: String?,
              modifier: Modifier = Modifier,
              tint: Color = Color.Unspecified
          ) {
              Box(
                  modifier = modifier
                      .size(38.dp)
                      .clip(ChiyuriGothicShape)
                      .background(Color(0xFF160609))
                      .border(1.dp, Color(0xFF8F1027), ChiyuriGothicShape)
                      .padding(8.dp)
              ) {
                  Canvas(Modifier.fillMaxSize()) {
                      val inset = 2.dp.toPx()
                      val p = Path().apply {
                          moveTo(inset, size.height * 0.72f)
                          lineTo(inset, size.height * 0.28f)
                          lineTo(size.width * 0.5f, inset)
                          lineTo(size.width - inset, size.height * 0.28f)
                          lineTo(size.width - inset, size.height * 0.72f)
                          lineTo(size.width * 0.5f, size.height - inset)
                          close()
                      }
                      drawPath(p, Color(0xFF4B0A18), style = Stroke(width = 1.dp.toPx()))
                  }
                  Icon(imageVector = imageVector, contentDescription = contentDescription,
                      modifier = Modifier.fillMaxSize(), tint = tint)
              }
          }

          @Composable
          fun GothicIconButton(
              onClick: () -> Unit,
              modifier: Modifier = Modifier,
              enabled: Boolean = true,
              content: @Composable () -> Unit
          ) {
              Box(modifier = modifier.clip(ChiyuriGothicShape)
                  .background(Color(0xFF17070B))
                  .border(1.dp, Color(0xFF781024), ChiyuriGothicShape)) {
                  IconButton(onClick = onClick, enabled = enabled,
                      modifier = Modifier.size(42.dp), content = content)
              }
          }
          """
          ui.write_text(source, encoding="utf-8")

          for name in ["MainActivity.kt", "AppUpdates.kt", "TrackDetailsComponents.kt"]:
              path = base / name
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              import re
              text = re.sub(r"(?<![A-Za-z0-9_])Icon[(]", "GothicIcon(", text)
              if name == "AppUpdates.kt":
                  text = text.replace("com.chiyuri.player.GothicIcon(", "GothicIcon(")
                  if "import com.chiyuri.player.GothicIcon" not in text:
                      lines = text.splitlines()
                      package_index = next(i for i, line in enumerate(lines) if line.startswith("package "))
                      lines.insert(package_index + 1, "import com.chiyuri.player.GothicIcon")
                      text = chr(10).join(lines) + chr(10)
              if name == "MainActivity.kt":
                  text = text.replace("IconButton(", "GothicIconButton(")
              path.write_text(text, encoding="utf-8")

          print("Installed pointed Gothic panels, framed Gothic glyphs and custom icon buttons.")
          PY
          grep -RIn "GothicIconButton\|GothicIcon(" app/src/main/java/com/chiyuri/player

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore release signing key
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$ANDROID_SIGNING_KEY_BASE64" || {
            echo "::error::Add repository Actions secret ANDROID_SIGNING_KEY_BASE64 before building releases."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/chiyuri-signing"
          echo "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/chiyuri-signing/release.jks"
          test -s "$RUNNER_TEMP/chiyuri-signing/release.jks"

      - name: Run unit tests
        run: gradle testDebugUnitTest -PVERSION_CODE=207

      - name: Build signed release APK
        env:
          CHIYURI_KEYSTORE_PATH: ${{ runner.temp }}/chiyuri-signing/release.jks
          CHIYURI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHIYURI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHIYURI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$CHIYURI_KEYSTORE_PASSWORD"
          test -n "$CHIYURI_KEY_ALIAS"
          test -n "$CHIYURI_KEY_PASSWORD"
          gradle --no-build-cache clean assembleRelease -PVERSION_CODE=207

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee ChiyuriPlayer-0.2.7.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChiyuriPlayer-0.2.7
          path: |
            app/build/outputs/apk/release/app-release.apk
            ChiyuriPlayer-0.2.7.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.7
          name: ChiyuriPlayer 0.2.7
          body: |
            Прозрачность мини-плеера 50%, версия из BuildConfig, готические иконки и угловатые кнопки.
            Unit-тесты и проверка подписи должны завершиться успешно.
            APK подписан тем же постоянным ключом, что и предыдущая версия.
          files: |
            app/build/outputs/apk/release/app-release.apk
            ChiyuriPlayer-0.2.7.sha256
          make_latest: true
          fail_on_unmatched_files: true
