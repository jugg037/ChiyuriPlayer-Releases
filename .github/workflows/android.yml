      - name: Upload patched source for metadata audit
        uses: actions/upload-artifact@v4
        with:
          name: ChiyuriPlayer-source-audit-${{ github.run_number }}
          path: |
            app/src/main/java
            app/src/main/AndroidManifest.xml
            app/src/main/res
