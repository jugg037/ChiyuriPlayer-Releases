name: Android release build

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/android.yml"
      - ".github/scripts/patch_0412.py"
      - ".github/scripts/patch_0414.py"
      - ".github/scripts/patch_0415.py"
      - ".github/scripts/patch_0416.py"
      - ".github/scripts/patch_0418.py"
      - ".github/scripts/patch_0419.py"
      - ".github/scripts/patch_0420.py"
      - ".github/scripts/patch_0421.py"
      - ".github/scripts/patch_0422.py"
      - ".github/scripts/patch_0423.py"
      - ".github/scripts/patch_0424.py"
      - ".github/scripts/patch_0425.py"
      - "chiyuri_emblem.png"
      - ".github/assets/chiyuri_background.webp"
      - ".github/scripts/patch_0415.py"
      - ".github/assets/chiyuri_background.webp.b64"
      - "ChiyuriPlayer-0.2.0-source-prep.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chiyuriplayer-release-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: "0.5.0"
      APP_VERSION_CODE: "336"
    steps:
      - name: Checkout public release repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f ChiyuriPlayer-0.2.0-source-prep.zip || {
            echo "::error::Upload ChiyuriPlayer-0.2.0-source-prep.zip to the repository root first."
            exit 1
          }

      - name: Extract application source
        run: |
          mkdir -p /tmp/chiyuri-source
          unzip -q ChiyuriPlayer-0.2.0-source-prep.zip -d /tmp/chiyuri-source
          test -f /tmp/chiyuri-source/ChiyuriPlayer-main/app/build.gradle.kts
          rsync -a --exclude='.github/' --exclude='README.md' --exclude='README_RU.md' /tmp/chiyuri-source/ChiyuriPlayer-main/ "$GITHUB_WORKSPACE"/

      - name: Inspect update downloader and playback notification implementation
        run: |
          echo "===== AppUpdates.kt ====="
          nl -ba app/src/main/java/com/chiyuri/player/AppUpdates.kt
          echo "===== PlaybackService.kt ====="
          nl -ba app/src/main/java/com/chiyuri/player/PlaybackService.kt
          echo "===== Manifest ====="
          nl -ba app/src/main/AndroidManifest.xml

      - name: Make update downloads persistent, cancellable and visible in notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path("app/src/main/java/com/chiyuri/player")
          updates = base / "AppUpdates.kt"
          source = updates.read_text(encoding="utf-8")

          imports = [
              "import android.app.NotificationChannel",
              "import android.app.NotificationManager",
              "import android.app.PendingIntent",
              "import android.content.BroadcastReceiver",
              "import android.os.Handler",
              "import android.os.Looper",
              "import androidx.core.app.NotificationCompat",
              "import androidx.core.app.NotificationManagerCompat",
              "import kotlinx.coroutines.CancellationException",
              "import kotlinx.coroutines.suspendCancellableCoroutine",
              "import kotlinx.coroutines.currentCoroutineContext",
              "import kotlinx.coroutines.ensureActive",
              "import kotlin.coroutines.resume",
              "import kotlin.coroutines.resumeWithException",
              "import java.util.concurrent.atomic.AtomicReference",
          ]
          for item in imports:
              if item not in source:
                  source = source.replace("import android.content.Context\n", "import android.content.Context\n" + item + "\n", 1)

          start = source.index("    suspend fun downloadAndVerify(")
          end = source.index("\n    @Suppress(\"DEPRECATION\")", start)
          method = r'''    suspend fun downloadAndVerify(
              context: Context,
              info: UpdateInfo,
              fileName: String = "chiyuriplayer-update.apk",
              onProgress: (Long, Long) -> Unit
          ): File {
              val apk = File(context.cacheDir, fileName)
              apk.delete()
              try {
                  downloadFileCancellable(info, apk, onProgress)
                  return withContext(Dispatchers.IO) {
                  currentCoroutineContext().ensureActive()
                  val checksumConnection = URL(info.checksumUrl).openConnection() as HttpURLConnection
                  val expected = try {
                      checksumConnection.connectTimeout = 10000
                      checksumConnection.readTimeout = 15000
                      checksumConnection.getInputStream().bufferedReader().use {
                          it.readText().trim().substringBefore(' ').lowercase()
                      }
                  } finally {
                      checksumConnection.disconnect()
                  }
                  currentCoroutineContext().ensureActive()
                  val digest = MessageDigest.getInstance("SHA-256")
                  val actual = apk.inputStream().use { input ->
                      val buffer = ByteArray(64 * 1024)
                      while (true) {
                          currentCoroutineContext().ensureActive()
                          val count = input.read(buffer)
                          if (count < 0) break
                          if (count > 0) digest.update(buffer, 0, count)
                      }
                      digest.digest().joinToString("") { "%02x".format(it) }
                  }
                  check(expected.length == 64 && actual.equals(expected, true)) {
                      "Контрольная сумма SHA-256 не совпадает"
                  }
                  currentCoroutineContext().ensureActive()
                  verifySigner(context, apk)
                  apk
                  }
              } catch (cancelled: CancellationException) {
                  apk.delete()
                  throw cancelled
              }
          }

          private suspend fun downloadFileCancellable(
              info: UpdateInfo,
              apk: File,
              onProgress: (Long, Long) -> Unit
          ) = suspendCancellableCoroutine<Unit> { continuation ->
              val connectionRef = AtomicReference<HttpURLConnection?>()
              val inputRef = AtomicReference<java.io.InputStream?>()
              val outputRef = AtomicReference<java.io.FileOutputStream?>()
              val threadRef = AtomicReference<Thread?>()
              val worker = Thread({
                  var connection: HttpURLConnection? = null
                  try {
                      connection = URL(info.apkUrl).openConnection() as HttpURLConnection
                      connectionRef.set(connection)
                      if (!continuation.isActive) {
                          connection.disconnect()
                          return@Thread
                      }
                      connection.connectTimeout = 15000
                      connection.readTimeout = 30000
                      connection.instanceFollowRedirects = true
                      if (connection.responseCode !in 200..299) {
                          error("Не удалось скачать APK: HTTP " + connection.responseCode)
                      }
                      val total = connection.contentLengthLong.takeIf { it > 0 } ?: info.sizeBytes
                      connection.inputStream.use { input ->
                          inputRef.set(input)
                          try {
                              java.io.FileOutputStream(apk).use { output ->
                                  outputRef.set(output)
                                  try {
                                      val buffer = ByteArray(64 * 1024)
                                      var done = 0L
                                      while (true) {
                                          if (!continuation.isActive) throw CancellationException("Загрузка отменена")
                                          val count = input.read(buffer)
                                          if (count < 0) break
                                          if (count == 0) continue
                                          output.write(buffer, 0, count)
                                          done += count
                                          val completed = done
                                          Handler(Looper.getMainLooper()).post {
                                              if (continuation.isActive) onProgress(completed, total)
                                          }
                                      }
                                      output.fd.sync()
                                  } finally {
                                      outputRef.compareAndSet(output, null)
                                  }
                              }
                          } finally {
                              inputRef.compareAndSet(input, null)
                          }
                      }
                      if (continuation.isActive) continuation.resume(Unit)
                  } catch (failure: Throwable) {
                      apk.delete()
                      if (continuation.isActive) continuation.resumeWithException(failure)
                  } finally {
                      connection?.disconnect()
                      connectionRef.set(null)
                  }
              }, "ChiyuriUpdateDownload").apply { isDaemon = true }
              threadRef.set(worker)
              continuation.invokeOnCancellation {
                  runCatching { inputRef.getAndSet(null)?.close() }
                  runCatching { outputRef.getAndSet(null)?.close() }
                  connectionRef.getAndSet(null)?.disconnect()
                  threadRef.get()?.interrupt()
                  apk.delete()
              }
              worker.start()
          }
          '''
          source = source[:start] + method + source[end:]

          screen_start = source.index("@Composable\ninternal fun UpdateCenterScreen(")
          screen_end = source.index("\n@Composable\ninternal fun AutoUpdateSettingsScreen(", screen_start)
          screen = r'''@Composable
          internal fun UpdateCenterScreen(modifier: androidx.compose.ui.Modifier = androidx.compose.ui.Modifier) {
              val context = androidx.compose.ui.platform.LocalContext.current
              val scope = androidx.compose.runtime.rememberCoroutineScope()
              var update by androidx.compose.runtime.remember { androidx.compose.runtime.mutableStateOf<UpdateInfo?>(null) }
              var checking by androidx.compose.runtime.remember { androidx.compose.runtime.mutableStateOf(false) }
              var status by androidx.compose.runtime.remember { androidx.compose.runtime.mutableStateOf("Проверьте наличие новой версии") }
              var error by androidx.compose.runtime.remember { androidx.compose.runtime.mutableStateOf<String?>(null) }
              var workInfo by androidx.compose.runtime.remember { androidx.compose.runtime.mutableStateOf<androidx.work.WorkInfo?>(null) }

              var notificationPermissionMessage by androidx.compose.runtime.remember { androidx.compose.runtime.mutableStateOf<String?>(null) }
              val notificationPermissionLauncher = androidx.activity.compose.rememberLauncherForActivityResult(
                  androidx.activity.result.contract.ActivityResultContracts.RequestPermission()
              ) { granted ->
                  notificationPermissionMessage = if (granted) null else
                      "Уведомления отключены. Загрузка продолжится, но прогресс может быть недоступен в шторке."
              }

              androidx.compose.runtime.LaunchedEffect(context, update?.versionCode) {
                  val targetVersionCode = update?.versionCode
                  workInfo = null
                  if (targetVersionCode != null) {
                      val manager = androidx.work.WorkManager.getInstance(context)
                      while (true) {
                          workInfo = kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {
                              manager.getWorkInfosForUniqueWork(UpdateDownloadWorker.WORK_NAME).get()
                                  .firstOrNull { "chiyuri_update_version_" + targetVersionCode in it.tags }
                          }
                          kotlinx.coroutines.delay(500)
                      }
                  }
              }
              androidx.compose.runtime.LaunchedEffect(Unit) {
                  if (update == null) {
                      checking = true
                      try {
                          update = AppUpdates.checkLatest()
                          status = if (update == null) "У вас установлена последняя версия." else "Найдено обновление."
                      } catch (e: Exception) {
                          error = e.message ?: "Ошибка проверки обновлений"
                          status = "Проверка не завершена"
                      } finally {
                          checking = false
                      }
                  }
              }

              val currentWorkInfo = workInfo?.takeIf { task ->
                  update?.let { "chiyuri_update_version_" + it.versionCode in task.tags } == true
              }
              val state = currentWorkInfo?.state
              val downloading = state == androidx.work.WorkInfo.State.RUNNING ||
                  state == androidx.work.WorkInfo.State.ENQUEUED
              val progress = currentWorkInfo?.progress?.getInt("progress", 0)?.coerceIn(0, 100) ?: 0
              val downloadedPath = currentWorkInfo?.outputData?.getString("apk_path")
              val downloadError = if (state == androidx.work.WorkInfo.State.FAILED) {
                  currentWorkInfo.outputData.getString("error") ?: "Не удалось скачать обновление."
              } else null
              val downloadStatus = when (state) {
                  androidx.work.WorkInfo.State.RUNNING,
                  androidx.work.WorkInfo.State.ENQUEUED -> "Загрузка продолжается в фоне и не сбрасывается при смене вкладки."
                  androidx.work.WorkInfo.State.SUCCEEDED -> "APK загружен. SHA-256 и подпись проверены."
                  androidx.work.WorkInfo.State.CANCELLED -> "Загрузка отменена."
                  androidx.work.WorkInfo.State.FAILED -> "Загрузка не завершена."
                  else -> null
              }

              androidx.compose.foundation.layout.Column(
                  modifier.fillMaxSize().verticalScroll(androidx.compose.foundation.rememberScrollState()),
                  verticalArrangement = androidx.compose.foundation.layout.Arrangement.spacedBy(12.dp)
              ) {
                  androidx.compose.material3.Card(
                      colors = androidx.compose.material3.CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)
                  ) {
                      androidx.compose.foundation.layout.Column(
                          Modifier.padding(18.dp),
                          verticalArrangement = androidx.compose.foundation.layout.Arrangement.spacedBy(10.dp)
                      ) {
                          androidx.compose.material3.Icon(
                              androidx.compose.material.icons.Icons.Default.SystemUpdate,
                              null,
                              tint = MaterialTheme.colorScheme.primary,
                              modifier = Modifier.size(42.dp)
                          )
                          androidx.compose.material3.Text("Центр обновлений", style = MaterialTheme.typography.titleLarge)
                          androidx.compose.material3.Text(
                              "Установлена версия " + AppUpdates.CURRENT_VERSION,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                          androidx.compose.material3.Text(downloadStatus ?: status, color = MaterialTheme.colorScheme.onSurfaceVariant)
                          if (checking) androidx.compose.material3.LinearProgressIndicator(Modifier.fillMaxWidth())
                          if (downloading) {
                              androidx.compose.material3.LinearProgressIndicator(
                                  progress = { progress / 100f },
                                  modifier = Modifier.fillMaxWidth(),
                                  color = MaterialTheme.colorScheme.primary,
                                  trackColor = MaterialTheme.colorScheme.surfaceVariant
                              )
                              androidx.compose.material3.Text("Загрузка " + progress + "%")
                          }
                          error?.let { androidx.compose.material3.Text(it, color = MaterialTheme.colorScheme.error) }
                          downloadError?.let { androidx.compose.material3.Text(it, color = MaterialTheme.colorScheme.error) }
                          notificationPermissionMessage?.let {
                              androidx.compose.material3.Text(it, color = MaterialTheme.colorScheme.tertiary)
                          }
                          update?.let { info ->
                              androidx.compose.material3.HorizontalDivider()
                              androidx.compose.material3.Text(
                                  "Доступна версия " + info.version,
                                  style = MaterialTheme.typography.titleMedium,
                                  color = MaterialTheme.colorScheme.primary
                              )
                              androidx.compose.material3.Text(
                                  info.notes.ifBlank { "Исправления ошибок и улучшения стабильности." },
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                              androidx.compose.material3.Text(
                                  "Размер: " + if (info.sizeBytes > 0) String.format(java.util.Locale.getDefault(), "%.1f МБ", info.sizeBytes / 1048576f) else "неизвестен",
                                  style = MaterialTheme.typography.bodySmall
                              )
                              if (state == androidx.work.WorkInfo.State.SUCCEEDED &&
                                  ("chiyuri_update_version_" + info.versionCode) in (currentWorkInfo?.tags ?: emptySet()) &&
                                  !downloadedPath.isNullOrBlank() && java.io.File(downloadedPath).exists()
                              ) {
                                  androidx.compose.material3.Button(
                                      onClick = { AppUpdates.install(context, java.io.File(downloadedPath)) },
                                      modifier = Modifier.fillMaxWidth()
                                  ) { androidx.compose.material3.Text("Установить загруженное обновление") }
                              } else {
                                  androidx.compose.material3.Button(
                                      enabled = !downloading && !checking,
                                      onClick = {
                                          if (android.os.Build.VERSION.SDK_INT >= 33 &&
                                              context.checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED
                                          ) {
                                              notificationPermissionLauncher.launch(android.Manifest.permission.POST_NOTIFICATIONS)
                                          }
                                          val request = androidx.work.OneTimeWorkRequestBuilder<UpdateDownloadWorker>()
                                               .addTag("chiyuri_update_version_" + info.versionCode)
                                              .setInputData(
                                                  androidx.work.workDataOf(
                                                      "version" to info.version,
                                                      "versionCode" to info.versionCode,
                                                      "notes" to info.notes,
                                                      "apkUrl" to info.apkUrl,
                                                      "checksumUrl" to info.checksumUrl,
                                                      "sizeBytes" to info.sizeBytes
                                                  )
                                              )
                                              .build()
                                          androidx.work.WorkManager.getInstance(context).enqueueUniqueWork(
                                              UpdateDownloadWorker.WORK_NAME,
                                              androidx.work.ExistingWorkPolicy.REPLACE,
                                              request
                                          )
                                          error = null
                                      },
                                      modifier = Modifier.fillMaxWidth()
                                  ) {
                                      androidx.compose.material3.Icon(androidx.compose.material.icons.Icons.Default.Download, null)
                                      androidx.compose.foundation.layout.Spacer(Modifier.width(8.dp))
                                      androidx.compose.material3.Text("Скачать обновление")
                                  }
                              }
                          }
                          if (downloading) {
                              androidx.compose.material3.OutlinedButton(
                                  onClick = {
                                      androidx.work.WorkManager.getInstance(context).cancelUniqueWork(UpdateDownloadWorker.WORK_NAME)
                                      UpdateDownloadNotifications.cancel(context)
                                  },
                                  modifier = Modifier.fillMaxWidth()
                              ) { androidx.compose.material3.Text("Отменить загрузку") }
                          }
                          androidx.compose.material3.OutlinedButton(
                              enabled = !checking && !downloading,
                              onClick = {
                                  scope.launch {
                                      checking = true
                                      error = null
                                      status = "Проверяем GitHub…"
                                      try {
                                          update = AppUpdates.checkLatest()
                                          status = if (update == null) "У вас установлена последняя версия." else "Найдено обновление."
                                      } catch (e: Exception) {
                                          error = e.message ?: "Ошибка проверки обновлений"
                                          status = "Проверка не завершена"
                                      } finally {
                                          checking = false
                                      }
                                  }
                              },
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              androidx.compose.material3.Icon(androidx.compose.material.icons.Icons.Default.Refresh, null)
                              androidx.compose.foundation.layout.Spacer(Modifier.width(8.dp))
                              androidx.compose.material3.Text("Проверить обновления")
                          }
                      }
                  }
                  androidx.compose.material3.Text(
                      "Загрузка продолжается при переключении вкладок. Её можно отменить здесь или прямо из системного уведомления. Перед установкой проверяются SHA-256 и сертификат подписи.",
                      style = MaterialTheme.typography.bodySmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant
                  )
              }
          }
          '''
          source = source[:screen_start] + screen + source[screen_end:]
          source += r'''

          internal class UpdateDownloadWorker(
              context: Context,
              params: WorkerParameters
          ) : CoroutineWorker(context, params) {
              override suspend fun getForegroundInfo(): androidx.work.ForegroundInfo {
                  return UpdateDownloadNotifications.foregroundInfo(
                      applicationContext,
                      0L,
                      inputData.getLong("sizeBytes", 0L),
                      inputData.getString("version").orEmpty()
                  )
              }

              override suspend fun doWork(): Result {
                  val version = inputData.getString("version") ?: return Result.failure()
                  val apkUrl = inputData.getString("apkUrl") ?: return Result.failure()
                  val checksumUrl = inputData.getString("checksumUrl") ?: return Result.failure()
                  val info = UpdateInfo(
                      version,
                      inputData.getInt("versionCode", 0),
                      inputData.getString("notes").orEmpty(),
                      apkUrl,
                      checksumUrl,
                      inputData.getLong("sizeBytes", 0L)
                  )
                  return try {
                      setForeground(getForegroundInfo())
                      var lastPercent = -1
                      var lastReportedBytes = 0L
                      val file = AppUpdates.downloadAndVerify(
                          applicationContext,
                          info,
                          "chiyuriplayer-update-" + id + ".apk"
                      ) { done, total ->
                          val percent = if (total > 0L) ((done * 100L) / total).toInt().coerceIn(0, 100) else 0
                          if (percent != lastPercent || done - lastReportedBytes >= 512L * 1024L || (total > 0L && done >= total)) {
                              lastPercent = percent
                              lastReportedBytes = done
                              setProgressAsync(androidx.work.workDataOf(
                                  "progress" to percent, "done" to done, "total" to total
                              ))
                              setForegroundAsync(
                                  UpdateDownloadNotifications.foregroundInfo(applicationContext, done, total, version)
                              )
                          }
                      }
                      UpdateDownloadNotifications.cancel(applicationContext)
                      UpdateDownloadNotifications.showComplete(applicationContext, version)
                      Result.success(androidx.work.workDataOf("apk_path" to file.absolutePath))
                  } catch (cancelled: CancellationException) {
                      UpdateDownloadNotifications.cancel(applicationContext)
                      throw cancelled
                  } catch (failure: Exception) {
                      UpdateDownloadNotifications.cancel(applicationContext)
                      Result.failure(androidx.work.workDataOf("error" to (failure.message ?: "Не удалось скачать обновление")))
                  }
              }

              companion object { const val WORK_NAME = "chiyuri_manual_update" }
          }

          internal object UpdateDownloadNotifications {
              private const val CHANNEL_ID = "chiyuri_update_download"
              private const val PROGRESS_ID = 3140
              private const val COMPLETE_ID = 3141

              private fun ensureChannel(context: Context) {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val manager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      manager.createNotificationChannel(
                          NotificationChannel(CHANNEL_ID, "Загрузка обновлений ChiyuriPlayer", NotificationManager.IMPORTANCE_LOW).apply {
                              description = "Ход загрузки и проверки обновлений"
                              setShowBadge(false)
                          }
                      )
                  }
              }

              fun foregroundInfo(context: Context, done: Long, total: Long, version: String): androidx.work.ForegroundInfo {
                  ensureChannel(context)
                  val cancelIntent = Intent(context, CancelUpdateDownloadReceiver::class.java)
                  val cancelPending = PendingIntent.getBroadcast(
                      context, PROGRESS_ID, cancelIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val percent = if (total > 0L) ((done * 100L) / total).toInt().coerceIn(0, 100) else 0
                  val sizeText = if (total > 0L) formatSize(done) + " / " + formatSize(total) else formatSize(done)
                  val notification = NotificationCompat.Builder(context, CHANNEL_ID)
                      .setSmallIcon(R.drawable.media3_notification_small_icon)
                      .setContentTitle("ChiyuriPlayer · обновление " + version)
                      .setContentText("Загрузка " + percent + "% · " + sizeText)
                      .setProgress(100, percent, false)
                      .setColor(0xFFB20D24.toInt())
                      .setColorized(true)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setCategory(NotificationCompat.CATEGORY_PROGRESS)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Отменить", cancelPending)
                      .build()
                  return androidx.work.ForegroundInfo(
                      PROGRESS_ID,
                      notification,
                      android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC
                  )
              }

              fun showComplete(context: Context, version: String) {
                  ensureChannel(context)
                  val open = Intent(context, MainActivity::class.java)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                      .putExtra("open_updates", true)
                  val pending = PendingIntent.getActivity(
                      context, COMPLETE_ID, open,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val notification = NotificationCompat.Builder(context, CHANNEL_ID)
                      .setSmallIcon(R.drawable.media3_notification_small_icon)
                      .setContentTitle("Обновление ChiyuriPlayer загружено")
                      .setContentText("Версия " + version + " скачана и проверена. Нажмите, чтобы установить.")
                      .setContentIntent(pending)
                      .setAutoCancel(true)
                      .setColor(0xFFB20D24.toInt())
                      .setColorized(true)
                      .setOnlyAlertOnce(true)
                      .build()
                  runCatching { NotificationManagerCompat.from(context).notify(COMPLETE_ID, notification) }
              }

              fun cancel(context: Context) {
                  runCatching { NotificationManagerCompat.from(context).cancel(PROGRESS_ID) }
              }

              private fun formatSize(bytes: Long): String {
                  if (bytes < 1024L) return bytes.toString() + " Б"
                  if (bytes < 1024L * 1024L) return String.format(java.util.Locale.getDefault(), "%.0f КБ", bytes / 1024f)
                  return String.format(java.util.Locale.getDefault(), "%.1f МБ", bytes / (1024f * 1024f))
              }
          }

          internal class CancelUpdateDownloadReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  androidx.work.WorkManager.getInstance(context).cancelUniqueWork(UpdateDownloadWorker.WORK_NAME)
                  UpdateDownloadNotifications.cancel(context)
              }
          }
          '''
          updates.write_text(source, encoding="utf-8")

          service = base / "PlaybackService.kt"
