      - name: Make metadata writes compatible with Android document providers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/chiyuri/player/TrackMetadataRepository.kt")
          source = path.read_text(encoding="utf-8")
          marker = "    private fun contentMatches(context: Context, uri: Uri, expected: java.io.File): Boolean {"
          helper_lines = [
              "    /**",
              "     * SAF providers may reject rwt while supporting the standard truncating w mode.",
              "     * Keep byte-for-byte verification and rollback after either write mode.",
              "     */",
              "    private fun openTruncatingOutputStream(context: Context, uri: Uri): java.io.OutputStream {",
              "        var rwtFailure: Exception? = null",
              "        try {",
              "            context.contentResolver.openOutputStream(uri, \"rwt\")?.let { return it }",
              "        } catch (error: Exception) {",
              "            rwtFailure = error",
              "        }",
              "        return try {",
              "            context.contentResolver.openOutputStream(uri, \"w\")",
              "                ?: throw java.io.IOException(\"Поставщик файлов не разрешил запись.\")",
              "        } catch (error: Exception) {",
              "            rwtFailure?.let(error::addSuppressed)",
              "            throw error",
              "        }",
              "    }",
              ""
          ]
          helper = "\n".join(helper_lines) + "\n"
          if "private fun openTruncatingOutputStream(" not in source:
              count = source.count('context.contentResolver.openOutputStream(uri, "rwt")')
              if count < 1:
                  matches = [line.strip() for line in source.splitlines() if "openOutputStream(uri" in line]
                  raise SystemExit("No rwt metadata write site found. Output stream sites: " + repr(matches))
              source = source.replace(
                  'context.contentResolver.openOutputStream(uri, "rwt")',
                  'openTruncatingOutputStream(context, uri)'
              )
              if marker not in source:
                  raise SystemExit("Metadata content verification marker not found.")
              source = source.replace(marker, helper + marker, 1)
              path.write_text(source, encoding="utf-8")
          print("Metadata writes now fall back from rwt to w and retain byte-for-byte verification and rollback.")
          PY

      - name: Harden metadata transaction, recovery and editor state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path("app/src/main/java/com/chiyuri/player")
          repository = base / "TrackMetadataRepository.kt"
          source = repository.read_text(encoding="utf-8")
          start = source.index("    suspend fun writeMetadataToFile(")
          end = source.index("\n    /** Backward-compatible entry point", start)
          method = r'''    private fun writeFileWithFallback(context: Context, uri: Uri, source: java.io.File) {
              val failures = mutableListOf<String>()
              fun copyAndVerify(output: java.io.OutputStream) {
                  output.use { stream ->
                      source.inputStream().use { input -> input.copyTo(stream) }
                      stream.flush()
                      if (stream is java.io.FileOutputStream) stream.fd.sync()
                  }
                  if (!contentMatches(context, uri, source)) {
                      throw java.io.IOException("Записанные байты не совпадают с исходной копией.")
                  }
              }
              for (mode in listOf("rwt", "w")) {
                  try {
                      val stream = context.contentResolver.openOutputStream(uri, mode)
                          ?: throw java.io.IOException("openOutputStream($mode) вернул null.")
                      copyAndVerify(stream)
                      return
                  } catch (error: Exception) {
                      failures += "openOutputStream($mode): ${error.javaClass.simpleName}: ${error.message}"
                  }
              }
              for (mode in listOf("rwt", "wt")) {
                  try {
                      val descriptor = context.contentResolver.openFileDescriptor(uri, mode)
                          ?: throw java.io.IOException("openFileDescriptor($mode) вернул null.")
                      copyAndVerify(android.os.ParcelFileDescriptor.AutoCloseOutputStream(descriptor))
                      return
                  } catch (error: Exception) {
                      failures += "openFileDescriptor($mode): ${error.javaClass.simpleName}: ${error.message}"
                  }
              }
              throw java.io.IOException("Все способы записи/проверки не удались: " + failures.joinToString(" | "))
          }

          private fun describeMetadataFailure(error: Throwable): String {
              val chain = mutableListOf<String>()
              var current: Throwable? = error
              val seen = java.util.Collections.newSetFromMap(java.util.IdentityHashMap<Throwable, Boolean>())
              while (current != null && seen.add(current) && chain.size < 8) {
                  chain += current.javaClass.simpleName + ": " + (current.message ?: "без подробностей")
                  current = current.cause
              }
              error.suppressed.forEach { suppressed ->
                  chain += "suppressed " + suppressed.javaClass.simpleName + ": " + (suppressed.message ?: "без подробностей")
              }
              return chain.joinToString(" -> ")
          }

          suspend fun writeMetadataToFile(context: Context, uri: Uri, metadata: TrackMetadata): String? =
          kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {
              val mime = runCatching { context.contentResolver.getType(uri).orEmpty().lowercase() }.getOrDefault("")
              val displayFileName = runCatching {
                  context.contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { cursor ->
                      if (cursor.moveToFirst()) {
                          val index = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (index >= 0) cursor.getString(index).orEmpty() else ""
                      } else ""
                  }.orEmpty()
              }.getOrDefault("")
              val extension = (displayFileName.ifBlank { uri.lastPathSegment.orEmpty() })
                  .substringAfterLast('.', "").lowercase()
              val format = when {
                  mime == "audio/mpeg" || extension == "mp3" -> "mp3"
                  mime == "audio/flac" || mime == "audio/x-flac" || extension == "flac" -> "flac"
                  mime == "audio/mp4" || mime == "audio/x-m4a" || mime == "video/mp4" ||
                      extension == "m4a" || extension == "mp4" -> "m4a"
                  else -> return@withContext "Запись тегов поддерживается для MP3, FLAC и M4A. Этот формат пока не поддерживается."
              }

              val workDir = java.io.File(context.cacheDir, "media-tag-write").apply {
                  if (!exists() && !mkdirs()) throw java.io.IOException("Не удалось создать временную папку.")
                  if (!isDirectory || !canWrite()) throw java.io.IOException("Временная папка недоступна для записи.")
              }
              var original: java.io.File? = null
              var rewritten: java.io.File? = null
              var preserveTempBackup = false
              try {
                  val originalFile = java.io.File.createTempFile("original-", ".$format", workDir)
                  original = originalFile
                  val rewrittenFile = java.io.File.createTempFile("rewritten-", ".$format", workDir)
                  rewritten = rewrittenFile

                  val input = context.contentResolver.openInputStream(uri)
                      ?: throw java.io.IOException("Не удалось открыть исходный файл для резервного копирования.")
                  java.io.FileOutputStream(originalFile).use { backupOutput ->
                      input.use { it.copyTo(backupOutput) }
                      backupOutput.fd.sync()
                  }
                  require(originalFile.length() > 0L) {
                      "Исходный файл пуст или не удалось создать его резервную копию."
                  }

                  val artwork = downloadArtwork(metadata.artworkUrl)
                  when (format) {
                      "mp3" -> Mp3Id3TagWriter.rewrite(originalFile, rewrittenFile, metadata, artwork)
                      "flac" -> FlacMetadataWriter.rewrite(originalFile, rewrittenFile, metadata, artwork)
                      "m4a" -> Mp4MetadataWriter.rewrite(originalFile, rewrittenFile, metadata, artwork)
                  }
                  require(rewrittenFile.isFile && rewrittenFile.length() > 0L) {
                      "Не удалось подготовить новый файл с метаданными."
                  }

                  try {
                      writeFileWithFallback(context, uri, rewrittenFile)
                  } catch (writeError: Exception) {
                      var restored = false
                      val restoreFailures = mutableListOf<String>()
                      for (attempt in 1..2) {
                          try {
                              writeFileWithFallback(context, uri, originalFile)
                              restored = true
                              break
                          } catch (restoreError: Exception) {
                              // Keep each provider/mode failure for the final diagnostic; retry once.
                              restoreFailures += "attempt " + attempt + ": " + describeMetadataFailure(restoreError)
                          }
                      }

                      if (!restored) {
                          val recoveryDir = java.io.File(context.filesDir, "metadata-recovery").apply {
                              if (!exists() && !mkdirs()) throw java.io.IOException("Не удалось создать папку аварийных копий.")
                          }
                          val recovery = java.io.File.createTempFile("recovery-", ".$format", recoveryDir)
                          try {
                              java.io.FileOutputStream(recovery).use { output ->
                                  originalFile.inputStream().use { inputStream -> inputStream.copyTo(output) }
                                  output.fd.sync()
                              }
                              require(recovery.length() == originalFile.length()) {
                                  "Размер аварийной копии не совпадает с оригиналом."
                              }
                          } catch (backupError: Exception) {
                              preserveTempBackup = true
                              throw java.io.IOException(
                                  "Запись и восстановление не удались. Не изменяйте оригинал. Временная резервная копия сохранена: " +
                                      originalFile.absolutePath + ". Ошибка копирования: " + backupError.message,
                                  writeError
                              )
                          }
                          throw java.io.IOException(
                              "Запись и автоматическое восстановление не удались. Резервная копия исходного файла сохранена: " +
                                  recovery.absolutePath + ". Не изменяйте оригинал до восстановления. Ошибка записи: " +
                                  describeMetadataFailure(writeError) + ". Ошибки восстановления: " + restoreFailures.joinToString(" || "),
                              writeError
                          )
                      }
                      throw java.io.IOException(
                          "Запись не прошла проверку. Исходный файл восстановлен и проверен.",
                          writeError
                      )
                  }
                  null
              } catch (cancelled: kotlinx.coroutines.CancellationException) {
                  throw cancelled
              } catch (error: Exception) {
                  val detail = describeMetadataFailure(error)
                  "Не удалось записать метаданные: " + detail
              } finally {
                  if (!preserveTempBackup) original?.delete()
                  rewritten?.delete()
              }
          }
          '''
          source = source[:start] + method + source[end:]
          repository.write_text(source, encoding="utf-8")

          editor = base / "TrackDetailsComponents.kt"
          ui = editor.read_text(encoding="utf-8")
          button_start = ui.index("                OutlinedButton(\n                    enabled = uri != null && !loading && !writingToFile")
          button_end = ui.index("                Button(\n                    enabled = !loading", button_start)
          ui = ui[:button_start] + ui[button_end:]

          callback_start = ui.index(
              '                    scope.launch {\n'
              '                        writingToFile = true\n'
              '                        message = "Сохраняем изменения в текущий аудиофайл…"\n'
          )
          callback_end = ui.index("\n                    }", callback_start) + len("\n                    }")
          callback = '''                    scope.launch {
                          writingToFile = true
                          message = "Сохраняем изменения в текущий аудиофайл…"
                          try {
                              val targetUri = uri ?: throw IllegalStateException("Не выбран аудиофайл.")
                              val error = TrackMetadataRepository.writeMetadataToFile(context, targetUri, edited)
                              if (error == null) {
                                  TrackMetadataRepository.saveOverride(context, targetUri, edited)
                                  onApply(edited)
                              } else {
                                  message = "Не удалось сохранить файл: " + error
                              }
                          } catch (cancelled: kotlinx.coroutines.CancellationException) {
                              message = "Сохранение отменено. Проверьте состояние исходного файла перед повторной попыткой."
                              throw cancelled
                          } catch (error: Exception) {
                              message = "Не удалось сохранить файл: " + (error.message ?: "неизвестная ошибка")
                          } finally {
