name: Android release build

on:
  push:
    branches: [main]
    paths:
      - "ChiyuriPlayer-0.2.0-source-prep.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chiyuriplayer-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public release repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f ChiyuriPlayer-0.2.0-source-prep.zip || {
            echo "::error::Upload ChiyuriPlayer-0.2.0-source-prep.zip to the repository root first."
            exit 1
          }

      - name: Extract application source
        run: |
          mkdir -p /tmp/chiyuri-source
          unzip -q ChiyuriPlayer-0.2.0-source-prep.zip -d /tmp/chiyuri-source
          test -f /tmp/chiyuri-source/ChiyuriPlayer-main/app/build.gradle.kts
          rsync -a --exclude='.github/' --exclude='README.md' --exclude='README_RU.md' /tmp/chiyuri-source/ChiyuriPlayer-main/ "$GITHUB_WORKSPACE"/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore release signing key
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$ANDROID_SIGNING_KEY_BASE64" || {
            echo "::error::Add repository Actions secret ANDROID_SIGNING_KEY_BASE64 before building releases."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/chiyuri-signing"
          echo "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/chiyuri-signing/release.jks"
          test -s "$RUNNER_TEMP/chiyuri-signing/release.jks"

      - name: Run unit tests
        run: gradle testDebugUnitTest -PVERSION_CODE=200

      - name: Build signed release APK
        env:
          CHIYURI_KEYSTORE_PATH: ${{ runner.temp }}/chiyuri-signing/release.jks
          CHIYURI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHIYURI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHIYURI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$CHIYURI_KEYSTORE_PASSWORD"
          test -n "$CHIYURI_KEY_ALIAS"
          test -n "$CHIYURI_KEY_PASSWORD"
          gradle --no-build-cache clean assembleRelease -PVERSION_CODE=200

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee ChiyuriPlayer-0.2.0.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChiyuriPlayer-0.2.0
          path: |
            app/build/outputs/apk/release/app-release.apk
            ChiyuriPlayer-0.2.0.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: ChiyuriPlayer 0.2.0
          body: |
            Первая публичная сборка из репозитория ChiyuriPlayer-Releases.
            Unit-тесты и проверка подписи должны завершиться успешно.
            Подпись APK создана новым постоянным ключом проекта.
          files: |
            app/build/outputs/apk/release/app-release.apk
            ChiyuriPlayer-0.2.0.sha256
          make_latest: true
          fail_on_unmatched_files: true
