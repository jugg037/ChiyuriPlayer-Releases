          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$ANDROID_SIGNING_KEY_BASE64" || {
            echo "::error::Add repository Actions secret ANDROID_SIGNING_KEY_BASE64 before building releases."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/chiyuri-signing"
          echo "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/chiyuri-signing/release.jks"
          test -s "$RUNNER_TEMP/chiyuri-signing/release.jks"

      - name: Run unit tests
        run: gradle testDebugUnitTest -PVERSION_CODE=${APP_VERSION_CODE}

      - name: Run Android lint
        id: android_lint
        continue-on-error: true
        run: gradle lintRelease -PVERSION_CODE=${APP_VERSION_CODE}

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChiyuriPlayer-lint-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-release.html
            app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Stop release when Android lint reports errors
        if: steps.android_lint.outcome == 'failure'
        run: |
          echo "::error::Android Lint must pass before an APK can be published."
          exit 1

      - name: Ensure source is still latest main before building
        run: |
          set -eu
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::This run is stale; refusing to build an APK from an older main commit."
            exit 1
          fi

      - name: Build signed release APK
        env:
          CHIYURI_KEYSTORE_PATH: ${{ runner.temp }}/chiyuri-signing/release.jks
          CHIYURI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHIYURI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHIYURI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$CHIYURI_KEYSTORE_PASSWORD"
          test -n "$CHIYURI_KEY_ALIAS"
          test -n "$CHIYURI_KEY_PASSWORD"
          gradle --no-build-cache clean assembleRelease -PVERSION_CODE=${APP_VERSION_CODE}

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.chiyuri.player' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'" >/dev/null || {
            echo "::error::APK manifest version does not match the single Gradle release version."
            printf '%s\n' "$BADGING" | grep "^package:"
            exit 1
          }
          echo "APK manifest verified: versionName=$APP_VERSION_NAME versionCode=$APP_VERSION_CODE"
          sha256sum "$APK" | tee ChiyuriPlayer-$APP_VERSION_NAME.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChiyuriPlayer-${{ env.APP_VERSION_NAME }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            ChiyuriPlayer-${{ env.APP_VERSION_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Ensure source is still latest main before publishing
        run: |
          set -eu
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::A newer main commit exists; refusing to publish this stale APK."
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: ChiyuriPlayer ${{ env.APP_VERSION_NAME }}
          body: |
            Центр обновлений: исходная эмблема расположена по центру с масштабированием Fit и используется как фон визуального индикатора загрузки.
            Текстура крови переработана в алую, тёмную, неоднородную с прожилками, каплями и бликами; круговое заполнение и световая волна сохранены.
            При раскрытии мини-плеера отключён автоматический поиск текстов в интернете: отображаются только встроенные тексты и данные, сохранённые редактором.
            Версия приложения отображается в формате «версия приложения - versionCode»: 0.5.0 - 336.
          files: |
            app/build/outputs/apk/release/app-release.apk
            ChiyuriPlayer-${{ env.APP_VERSION_NAME }}.sha256
          make_latest: true
          fail_on_unmatched_files: true
