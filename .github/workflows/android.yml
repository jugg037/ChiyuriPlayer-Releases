      - name: Expand automatic lyrics search and sharpen Gothic wordmark
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path("app/src/main/java/com/chiyuri/player/MainActivity.kt")
          m = main.read_text(encoding="utf-8")
          m = m.replace(", style = androidx.compose.ui.text.TextStyle(shadow = androidx.compose.ui.graphics.Shadow(Color(0xFFFF2038), offset = androidx.compose.ui.geometry.Offset(0f, 2f), blurRadius = 9f))", "")
          main.write_text(m, encoding="utf-8")

          lyrics = Path("app/src/main/java/com/chiyuri/player/LyricsRepository.kt")
          s = lyrics.read_text(encoding="utf-8")
          start = s.index("    suspend fun search(")
          end = s.index("    private fun addSearchResults", start)
          replacement = r'''    suspend fun search(artist: String, title: String, durationMs: Long): LyricsResult? =
                  withContext(Dispatchers.IO) {
                      val cleanTitle = title.trim()
                      if (cleanTitle.isBlank()) return@withContext null
                      val cleanArtist = artist.trim()
                      val durationSeconds = (durationMs / 1000L).takeIf { it > 0L }
                      val titleVariants = lyricsTitleVariants(cleanTitle)
                      val artistVariants = lyricsArtistVariants(cleanArtist)
                      val candidates = linkedMapOf<String, LyricsCandidate>()
          
                      // Primary provider: LRCLIB, including exact and broad metadata search.
                      for (titleVariant in titleVariants.take(3)) {
                          for (artistVariant in (artistVariants.take(2) + "").distinct()) {
                              val path = buildString {
                                  append("/api/get?track_name=").append(encode(titleVariant))
                                  if (artistVariant.isNotBlank()) append("&artist_name=").append(encode(artistVariant))
                                  if (durationSeconds != null) append("&duration=").append(durationSeconds)
                              }
                              val raw = request(path) ?: continue
                              val candidate = runCatching { parseCandidate(JSONObject(raw)) }.getOrNull() ?: continue
                              candidates.putIfAbsent(candidateKey(candidate), candidate)
                              if (isStrongMatch(candidate, cleanTitle, cleanArtist, durationSeconds)) return@withContext candidate.result
                          }
                      }
                      for (titleVariant in titleVariants) {
                          for (artistVariant in (artistVariants.take(2) + "").distinct()) {
                              val path = buildString {
                                  append("/api/search?track_name=").append(encode(titleVariant))
                                  if (artistVariant.isNotBlank()) append("&artist_name=").append(encode(artistVariant))
                              }
                              addSearchResults(request(path), candidates)
                          }
                      }
                      val freeText = listOf(cleanArtist, cleanTitle).filter { it.isNotBlank() }.joinToString(" ")
                      if (freeText.isNotBlank()) addSearchResults(request("/api/search?q=" + encode(freeText)), candidates)
                      val bestLrcLib = candidates.values
                          .map { it to lyricsCandidateScore(it, cleanTitle, cleanArtist, durationSeconds) }
                          .maxByOrNull { it.second }
                      if (bestLrcLib != null && bestLrcLib.second >= 0.50) return@withContext bestLrcLib.first.result
          
                      // Secondary provider: lyrics.ovh direct title/artist lookup (plain lyrics).
                      for (titleVariant in titleVariants.take(2)) {
                          for (artistVariant in artistVariants.take(2)) {
                              val raw = requestAbsolute("https://api.lyrics.ovh/v1/${encodePath(artistVariant)}/${encodePath(titleVariant)}") ?: continue
                              val text = runCatching { JSONObject(raw).optString("lyrics") }.getOrNull()
                                  ?.takeIf { it.isNotBlank() && it != "null" } ?: continue
                              return@withContext LyricsResult(text, null)
                          }
                      }
          
                      // Final fallback: Deezer-backed suggestions from lyrics.ovh; rank before fetching.
                      val suggestions = linkedMapOf<String, JSONObject>()
                      val queries = listOf("$cleanArtist $cleanTitle", cleanTitle).filter { it.isNotBlank() }.distinct()
                      for (query in queries) {
                          val raw = requestAbsolute("https://api.lyrics.ovh/suggest/${encodePath(query)}") ?: continue
                          val data = runCatching { JSONObject(raw).optJSONArray("data") }.getOrNull() ?: continue
                          for (index in 0 until minOf(data.length(), 12)) {
                              val item = data.optJSONObject(index) ?: continue
                              val trackTitle = item.optString("title")
                              val trackArtist = item.optJSONObject("artist")?.optString("name").orEmpty()
                              if (trackTitle.isBlank() || trackArtist.isBlank()) continue
                              suggestions.putIfAbsent("${normalizeLyricsText(trackTitle)}|${normalizeLyricsText(trackArtist)}", item)
                          }
                      }
                      val ranked = suggestions.values.mapNotNull { item ->
                          val trackTitle = item.optString("title")
                          val trackArtist = item.optJSONObject("artist")?.optString("name").orEmpty()
                          val trackDuration = item.optLong("duration").takeIf { it > 0L } ?: 0L
                          val candidate = LyricsCandidate(LyricsResult(null, null), trackTitle, trackArtist, trackDuration)
                          candidate to lyricsCandidateScore(candidate, cleanTitle, cleanArtist, durationSeconds)
                      }.sortedByDescending { it.second }
                      for ((candidate, score) in ranked.take(4)) {
                          if (score < 0.58) continue
                          val raw = requestAbsolute("https://api.lyrics.ovh/v1/${encodePath(candidate.artist)}/${encodePath(candidate.title)}") ?: continue
                          val text = runCatching { JSONObject(raw).optString("lyrics") }.getOrNull()
                              ?.takeIf { it.isNotBlank() && it != "null" } ?: continue
                          return@withContext LyricsResult(text, null)
                      }
                      null
                  }
          
          '''
          s = s[:start] + replacement + s[end:]
          request_start = s.index("    private fun request(path: String): String? {")
          request_end = s.index("    private fun parseCandidate", request_start)
          request_block = '''    private fun request(path: String): String? = requestAbsolute("https://lrclib.net$path")
          
              private fun requestAbsolute(address: String): String? {
                  val connection = (URL(address).openConnection() as HttpURLConnection)
                  return try {
                      connection.requestMethod = "GET"
                      connection.connectTimeout = 5_000
                      connection.readTimeout = 5_000
                      connection.setRequestProperty("Accept", "application/json")
                      connection.setRequestProperty("User-Agent", "ChiyuriPlayer/0.2.5 (https://github.com/jugg037/ChiyuriPlayer-Releases)")
                      if (connection.responseCode !in 200..299) return null
                      connection.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                  } catch (_: Exception) {
                      null
                  } finally {
                      connection.disconnect()
                  }
              }
          
              private fun encodePath(value: String): String =
                  URLEncoder.encode(value, Charsets.UTF_8.name()).replace("+", "%20")
          
          '''
          s = s[:request_start] + request_block + s[request_end:]
          lyrics.write_text(s, encoding="utf-8")

          screen = Path("app/src/main/java/com/chiyuri/player/LyricsScreen.kt")
          ui = screen.read_text(encoding="utf-8")
          ui = ui.replace("Во встроенных тегах и LRCLIB текст не найден.", "Во встроенных тегах, LRCLIB, lyrics.ovh, SyncLRC и каталоге LiriQo текст не найден.")
          ui = ui.replace("Поиск использует точное совпадение, альтернативные варианты названия и исполнителя, а затем расширенный запрос.", "Поиск проверяет встроенные теги, LRCLIB, lyrics.ovh, SyncLRC и агрегатор LiriQo с несколькими музыкальными каталогами. Аудиофайл никуда не отправляется.")
          screen.write_text(ui, encoding="utf-8")

          print("Removed logo shadow blur; expanded lyrics lookup to LRCLIB, lyrics.ovh and Deezer suggestions.")
          PY

      - name: Add SyncLRC independent lyrics provider
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/chiyuri/player/LyricsRepository.kt")
          s = p.read_text(encoding="utf-8")
          marker = "// Final fallback: Deezer-backed suggestions from lyrics.ovh; rank before fetching."
          if marker not in s:
              raise SystemExit("Expected lyrics.ovh fallback marker not found; refusing to patch.")
          block = """                      // Independent provider: SyncLRC (synced, plain and karaoke-capable catalog).
                      val syncQuery = encodePath(listOf(cleanArtist, cleanTitle).filter { it.isNotBlank() }.joinToString(" "))
                      val syncRaw = requestAbsolute("https://api.synclrc.dev/search?q=" + syncQuery + "&limit=8")
                      val syncResults = runCatching { JSONObject(syncRaw ?: "").optJSONArray("results") }.getOrNull()
                      val syncCandidates = mutableListOf<Pair<LyricsCandidate, Double>>()
                      if (syncResults != null) {
                          for (index in 0 until syncResults.length()) {
                              val item = syncResults.optJSONObject(index) ?: continue
                              val nested = item.optJSONObject("lyrics")
                              val plain = nested?.optString("plain")?.takeIf { it.isNotBlank() && it != "null" }
                              val synced = nested?.optString("synced")?.takeIf { it.isNotBlank() && it != "null" }
                                  ?: nested?.optString("karaoke")?.takeIf { it.isNotBlank() && it != "null" }
                              if (plain == null && synced == null) continue
                              val candidate = LyricsCandidate(
                                  LyricsResult(plain, synced),
                                  item.optString("track"),
                                  item.optString("artist"),
                                  item.optLong("duration").takeIf { it > 0L } ?: 0L
                              )
                              val score = lyricsCandidateScore(candidate, cleanTitle, cleanArtist, durationSeconds)
                              if (score >= 0.58) syncCandidates.add(candidate to score)
                          }
                      }
                      syncCandidates.maxByOrNull { it.second }?.first?.let { return@withContext it.result }

          """
          idx = s.index(marker)
          line_start = s.rfind("\n", 0, idx) + 1
          s = s[:line_start] + block + s[line_start:]
          p.write_text(s, encoding="utf-8")
          print("Added SyncLRC with metadata scoring and synced/plain lyric parsing.")

          # Add LiriQo's normalized multi-provider catalog (Apple Music, Musixmatch,
          # Unison, NetEase, KuGou, QQ Music, LRCLIB and YouTube Music).
          p = Path("app/src/main/java/com/chiyuri/player/LyricsRepository.kt")
          s = p.read_text(encoding="utf-8")
          sync_marker = "// Independent provider: SyncLRC (synced, plain and karaoke-capable catalog)."
          if sync_marker not in s:
              raise SystemExit("SyncLRC insertion point missing; refusing LiriQo patch.")
          liriqo = """                      // Multi-provider fallback: LiriQo normalizes eight lyric catalogs.
                      val liriqoQuery = buildString {
                          append("https://api.liriqo-alfarrizi.my.id/v1/lyrics?title=").append(encode(cleanTitle))
                          if (cleanArtist.isNotBlank()) append("&artist=").append(encode(cleanArtist))
                          if (durationSeconds != null) append("&duration=").append(durationSeconds)
                      }
                      val liriqoRaw = requestAbsolute(liriqoQuery)
                      val liriqoRoot = runCatching { JSONObject(liriqoRaw ?: "") }.getOrNull()
                      val liriqoMetadata = liriqoRoot?.optJSONObject("metadata")
                      val liriqoPrimary = liriqoRoot?.optJSONObject("primary")
                          ?: liriqoRoot?.optJSONArray("tracks")?.optJSONObject(0)
                      if (liriqoPrimary != null && liriqoRoot?.optString("error").isNullOrBlank()) {
                          val liriqoPlain = liriqoPrimary.optString("plain")
                              .takeIf { it.isNotBlank() && it != "null" }
                          val timedArray = liriqoPrimary.optJSONArray("timed")
                          val liriqoLrc = buildString {
                              if (timedArray != null) {
                                  for (index in 0 until timedArray.length()) {
                                      val line = timedArray.optJSONObject(index) ?: continue
                                      val startMs = line.optLong("start", -1L)
                                      val lyric = line.optString("text").trim()
                                      if (startMs < 0L || lyric.isBlank()) continue
                                      val centiseconds = startMs / 10L
                                      val minutes = centiseconds / 6000L
                                      val seconds = (centiseconds % 6000L) / 100L
                                      val fraction = centiseconds % 100L
                                      append("[")
                                      append(minutes.toString().padStart(2, '0')).append(":")
                                      append(seconds.toString().padStart(2, '0')).append(".")
                                      append(fraction.toString().padStart(2, '0')).append("]")
                                      append(lyric).append("\\n")
                                  }
                              }
                          }.takeIf { it.isNotBlank() }
                          val liriqoTitle = liriqoPrimary.optString("title")
                              .ifBlank { liriqoPrimary.optString("track").ifBlank { liriqoMetadata?.optString("title").orEmpty().ifBlank { cleanTitle } } }
                          val liriqoArtist = liriqoPrimary.optString("artist")
                              .ifBlank { liriqoMetadata?.optString("artist").orEmpty().ifBlank { cleanArtist } }
                          val liriqoDuration = liriqoPrimary.optLong("duration").takeIf { it > 0L }
                              ?: liriqoMetadata?.optLong("duration")?.takeIf { it > 0L }
                              ?: durationSeconds ?: 0L
                          val liriqoResult = LyricsResult(
                              liriqoPlain ?: liriqoLrc?.lineSequence()?.mapNotNull { row ->
                                  row.substringAfter("]").takeIf { "]" in row && it.isNotBlank() }
                              }?.joinToString("\\n"),
                              liriqoLrc
                          )
                          val liriqoCandidate = LyricsCandidate(
                              liriqoResult, liriqoTitle, liriqoArtist, liriqoDuration
                          )
                          if ((liriqoResult.plainLyrics != null || liriqoResult.syncedLyrics != null) &&
                              lyricsCandidateScore(liriqoCandidate, cleanTitle, cleanArtist, durationSeconds) >= 0.50
                          ) return@withContext liriqoResult
                      }

          """
          idx = s.index(sync_marker)
          line_start = s.rfind("\n", 0, idx) + 1
          s = s[:line_start] + liriqo + s[line_start:]
          p.write_text(s, encoding="utf-8")
          print("Added LiriQo multi-provider fallback with metadata matching and normalized millisecond-to-LRC conversion.")
          PY

